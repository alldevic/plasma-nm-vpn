name: integration

# The integration cases (tests/integration) in a forky VM under KVM, reached over vsock, in both DNS modes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dns-mode: [resolvconf, resolved]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM and vsock for the runner user
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666", OPTIONS+="static_node=vhost-vsock"' |
            sudo tee /etc/udev/rules.d/99-pnv-kvm.rules
          sudo modprobe vhost_vsock
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --name-match=vhost-vsock
          ls -l /dev/kvm /dev/vhost-vsock
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils socat
      - id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.qcow2
          key: image-${{ matrix.dns-mode }}-${{ hashFiles('tests/integration/image/*') }}
      - name: Build the VM image
        if: steps.image.outputs.cache-hit != 'true'
        run: tests/integration/image/build.sh ${{ matrix.dns-mode }} image.qcow2
      # Saved at once, so that a failing case does not throw away the image.
      - if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.qcow2
          key: ${{ steps.image.outputs.cache-primary-key }}
      - id: cores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cores-staging
          key: cores-${{ hashFiles('cores/*.env', 'scripts/fetch-cores', 'scripts/cores.sh') }}
      - name: Fetch the cores (as for the packages, 1.2)
        if: steps.cores.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/src" -w /src debian:forky sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              ca-certificates git curl unzip python3 make gcc libc6-dev golang-go >/dev/null &&
            scripts/fetch-cores cores-staging'
      - if: steps.cores.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cores-staging
          key: ${{ steps.cores.outputs.cache-primary-key }}
      - name: Run the cases
        run: tests/integration/run.sh --dns-mode ${{ matrix.dns-mode }} --image image.qcow2 --cores cores-staging
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.dns-mode }}
          path: integration-out/
