<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The services of the sb daemon: only root may own them or talk to them (NM runs as root). -->
<busconfig>
  <policy user="root">
    <allow own_prefix="org.freedesktop.NetworkManager.pnv.hysteria2"/>
    <allow send_destination="org.freedesktop.NetworkManager.pnv.hysteria2"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.freedesktop.NetworkManager.pnv.hysteria2"/>
    <deny send_destination="org.freedesktop.NetworkManager.pnv.hysteria2"/>
  </policy>
</busconfig>
